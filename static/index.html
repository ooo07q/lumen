<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="rail" id="rail" aria-label="主要">
  <div class="brand" id="brand" role="button" tabindex="0"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="3.5" height="12" rx="1"/><rect x="8.5" y="4" width="3.5" height="12" rx="1"/><path d="M13.6 4.6l3.2-.8 2.6 11.6-3.2.8z"/></svg><span id="vault-name">…</span><span id="vault-where" class="vault-where"></span></div>
  <span class="rail-line"></span>
  <button data-go="journal" title="日記"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7 7h6M7 10h6M7 13h3"/></svg><span>日記</span></button>
  <button data-go="raw" title="筆記"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h7l3 3v11H5z"/><path d="M12 3v3h3"/></svg><span>筆記</span></button>
  <button data-go="assets" title="日記和筆記用到的圖片、PDF"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 9.5l-5.8 5.8a3.3 3.3 0 0 1-4.7-4.7l6.4-6.4a2.2 2.2 0 0 1 3.1 3.1l-6.3 6.3a1.1 1.1 0 0 1-1.6-1.6l5.6-5.6"/></svg><span>附件</span></button>
  <button data-go="wiki" title="AI 整理的知識庫"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5c2.5-1 4.5-1 7 .5 2.5-1.5 4.5-1.5 7-.5v10c-2.5-1-4.5-1-7 .5-2.5-1.5-4.5-1.5-7-.5z"/><path d="M10 6v10"/></svg><span>知識庫</span></button>
  <span class="rail-gap"></span>
  <button data-go="ai" title="和 AI 對話、請 AI 整理"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3l1.6 4.4L16 9l-4.4 1.6L10 15l-1.6-4.4L4 9l4.4-1.6z"/></svg><span>問 AI</span></button>
  <button id="set-btn" title="外觀、語言、Jev、連接 AI"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg><span>設定</span></button>
</nav>
<header class="top">
  <button id="toggle-left" class="icon-btn" title="顯示／隱藏左欄（⌘\）" aria-label="顯示或隱藏左欄"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect class="fill" x="3.2" y="4.2" width="4.6" height="11.6" rx="1" fill="currentColor"/><line x1="8" y1="4" x2="8" y2="16" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <div class="nav-btns"><button id="nav-back" class="icon-btn" title="上一頁（⌘[）" aria-label="上一頁" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="nav-fwd" class="icon-btn" title="下一頁（⌘]）" aria-label="下一頁" disabled><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
  <div id="search-form" class="search">
    <input id="search" type="search" placeholder="找頁面、筆記，或直接問 AI · ⌘↵ 問 AI" autocomplete="off">
    <div id="quick" class="quick" hidden></div>
  </div>
  <div id="jev-state" class="jev-state"></div>
  <button id="toggle-right" class="icon-btn" title="顯示／隱藏右欄（⌘⇧\）" aria-label="顯示或隱藏右欄"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect class="fill" x="12.2" y="4.2" width="4.6" height="11.6" rx="1" fill="currentColor"/><line x1="12" y1="4" x2="12" y2="16" stroke="currentColor" stroke-width="1.4"/></svg></button>
</header>

<main class="cols" id="cols">
  <nav class="left">
    <div class="lhead"><b id="lhead-name"></b><button id="lhead-act" hidden></button></div>
    <div class="left-actions"><button id="journal-btn" title="打開今天的日記，沒有就照模板建立">＋ 今天的日記</button><button id="new-btn" title="在筆記最上層新增一篇（右鍵點資料夾可以加在那裡）">＋ 新筆記</button></div>
    <div class="tabs" role="tablist">
      <button data-tab="journal">日記</button>
      <button data-tab="raw" class="on">筆記</button>
      <button data-tab="assets">附件</button>
      <button data-tab="wiki">知識庫</button>
      <button data-tab="results" hidden>搜尋</button>
    </div>
    <input id="filter" class="filter" type="search" placeholder="篩選">
    <div id="sub" class="kb-types" hidden></div>
    <div id="tree" class="tree"></div>
  </nav>
  <div class="gutter" data-gutter="left" title="拖曳調整寬度，雙擊收合／展開"></div>

  <section class="center">
    <div id="tabbar" class="tabbar" hidden></div>
    <div id="view" class="view">
      <div class="empty">
        <h2>從左邊打開一篇筆記</h2>
        <p>「日記」和「筆記」是你自己寫的，或從別處收進來的文章，AI 不會改。「附件」是筆記裡用到的圖片、PDF 等檔案。「知識庫」是 AI 讀了你的筆記之後寫的整理：每篇筆記一頁摘要，再加上每個主題、每個人物各一頁，不同筆記對同一件事的說法都收在同一頁。</p>
        <p>打開一篇之後，右邊這欄會列出：這篇寫到、但還沒連過去的知識庫頁面，以及不同筆記說法互相衝突、值得你看一眼的地方。</p>
        <p class="muted">⌘／Ctrl＋點擊在新分頁打開，分頁可以拖曳排序。欄與欄之間的線可以拖曳調整寬度。編輯時會自動儲存（⌘S 立刻存）；把檔案拖進筆記或貼上，就會存進附件並連結到這篇。</p>
      </div>
    </div>
  </section>
  <div class="gutter" data-gutter="right" title="拖曳調整寬度，雙擊收合／展開"></div>

  <aside class="right">
    <div class="rtabs" role="tablist"><button data-rtab="note" class="on">這篇筆記</button><button data-rtab="ai">✦ AI</button></div>
    <div id="panel" class="rpane"><div class="panel-empty muted">打開筆記後，這裡會出現連結和建議。</div></div>
    <div id="ai" class="rpane ai" hidden></div>
  </aside>
</main>
<div id="start" class="start" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="menu" class="menu" hidden></div>
<div id="modal" class="modal-back" hidden><div class="modal" role="dialog" aria-modal="true"><h3 id="modal-title"></h3><div id="modal-body"></div><div class="modal-acts"><button id="modal-cancel">取消</button><button id="modal-ok" class="primary">確定</button></div></div></div>
<script src="i18n-en.js"></script>
<script src="i18n-ja.js"></script>
<script src="i18n-ko.js"></script>
<script src="i18n.js"></script>
<script src="md.js"></script>
<script src="props.js"></script>
<script src="wys.js"></script>
<script src="app.js"></script>
</body>
</html>
